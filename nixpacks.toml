[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = [
  "npm install -g pnpm@9.15.9",
  "export PATH=$(npm root -g)/../bin:$PATH",
  "pnpm install --frozen-lockfile"
]

[phases.build]
cmds = [
  "export PATH=$(npm root -g)/../bin:$PATH",
  "pnpm run build"
]

[start]
cmd = "node --enable-source-maps artifacts/api-server/dist/index.mjs"
